[package]
name = "code_rust"
version = "0.1.3"
edition = "2021"

[lib]
name = "code_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
strsim = "0.10.0" # Быстрый Левенштейн
serde = { version = "1.0", features = ["derive"] } # Для удобной десериализации
regex = "1.10"
lazy_static = "1.5.0"
nilsimsa = {path = "nilsimsa-0.2.1"}
